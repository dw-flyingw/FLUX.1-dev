services:
  flux-inference:
    image: flux1-dev-flux-inference:blackwell
    container_name: flux-inference
    restart: unless-stopped
    runtime: nvidia
    networks:
      - default
      - proxy-net
    environment:
      HF_HOME: /data/huggingface
      HF_TOKEN: ${HF_TOKEN}
      # Container is pinned to physical GPU 2 via device_ids below, so inside the
      # container it appears as cuda:0.
      NVIDIA_GPU_DEVICE: 0
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/zscaler-root-ca.pem}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/zscaler-root-ca.pem}
      CURL_CA_BUNDLE: ${CURL_CA_BUNDLE:-/etc/ssl/certs/zscaler-root-ca.pem}

    ports:
      - "${FLUX_INFERENCE_PORT:-8630}:8000"

    volumes:
      - /data/huggingface:/data/huggingface:ro
      - ./models:/app/models:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro

    shm_size: '16gb'

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      start_interval: 10s

  app:
    image: flux1-dev-app:latest
    env_file: .env
    runtime: nvidia
    networks:
      proxy-net:
        priority: 0
      default:
        priority: 1
    ports:
      - "${FRONTEND_PORT:-8631}:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NIM_HOST: flux-inference
      FLUX_INFERENCE_PORT: "8000"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},flux-inference
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},flux-inference
      SSL_CERT_FILE: /etc/ssl/certs/zscaler-root-ca.pem
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/zscaler-root-ca.pem
      CURL_CA_BUNDLE: /etc/ssl/certs/zscaler-root-ca.pem
    volumes:
      - ./app:/app
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
    depends_on:
      - flux-inference

networks:
  default:
    name: flux-network
  proxy-net:
    external: true
